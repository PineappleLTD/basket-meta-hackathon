services:
  - type: web
    name: basket
    runtime: docker
    repo: https://github.com/PineappleLTD/basket
    branch: codex/free-cloud-deployment-20261104
    region: ohio
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    envVars:
      - key: PORT
        value: "10000"
      - key: BASKET_DATA_DIR
        value: /data
      - key: BASKET_REQUIRE_POSTGRES
        value: "true"
      - key: PMETF_DATABASE_URL
        sync: false
      - key: PMETF_NEWS_DATABASE_STATE
        value: "true"
      - key: META
        sync: false
