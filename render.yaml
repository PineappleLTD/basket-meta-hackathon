services:
  - type: web
    name: basket
    runtime: docker
    repo: https://github.com/PineappleLTD/basket
    branch: codex/render-deployment-20261104
    region: ohio
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: "off"
    disk:
      name: basket-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PORT
        value: "10000"
      - key: BASKET_DATA_DIR
        value: /data
      - key: META
        sync: false
